    examples: |
      - I want to talk to a person
      - Can you connect me to a human?
      - I need to speak to support
      - Let me talk to a real agent
      - Can I speak with customer care?
      - Transfer me to a human assistant
      - I don’t want to chat with the bot
      - Is someone from the team available?
      - I prefer human help
      - I’d like to speak to someone real
      - I want to speak with someone directly
      - Connect me to a support agent
      - Can you transfer me to a human?
      - I need to talk to a person
      - Let me chat with someone from the team
      - Talk to a real support member
      - Please connect me to human assistance
      - I don't want to talk to the bot
      - Give me the number for customer support
      - I want a real person to handle this

  # Regex for order_id
  - regex: order_id
    examples: |
      - \d{4,8}
